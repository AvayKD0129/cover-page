  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Avay Kumar Das — Senior iOS Engineer</title>
    <meta
      name="description"
      content="Senior iOS Engineer with 8+ years building polished consumer apps in SwiftUI, Swift and Objective-C for massive user bases."
    />
    <link rel="canonical" href="https://avaykumar.dev/" />
    <meta name="theme-color" content="#070d0b" />

    <script>
      // Resolve the theme before first paint so the page never flashes the wrong palette.
      // Dark is the default; only a visitor's own saved choice moves it to light.
      (function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avaykumar.dev/" />
    <meta property="og:title" content="Avay Kumar Das — Senior iOS Engineer" />
    <meta
      property="og:description"
      content="8+ years shipping consumer iOS at Zomato, OYO and Deutsche Telekom. SwiftUI, Swift, Objective-C — and the AI tooling around them."
    />
